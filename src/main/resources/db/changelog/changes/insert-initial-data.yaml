databaseChangeLog:
  - changeSet:
      id: insert-default-roles
      author: senjars
      context: "!test"
      changes:
        - insert:
            tableName: roles
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: role_name, value: "CUSTOMER" }
        - insert:
            tableName: roles
            columns:
              - column: { name: id, valueNumeric: 2 }
              - column: { name: role_name, value: "MANAGER" }

  - changeSet:
      id: insert-initial-users
      author: senjars
      context: "!test"
      changes:
        - insert:
            tableName: users
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: email, value: "customer@carsharing.com" }
              - column: { name: first_name, value: "Jan" }
              - column: { name: last_name, value: "Customer" }
              - column: { name: password, value: "$2a$10$0xQlqXuv/gTh278KTJvZneXSRy7GEb0qLRi1.yb4g/5nMXvf/ySIW" }
        - insert:
            tableName: users
            columns:
              - column: { name: id, valueNumeric: 2 }
              - column: { name: email, value: "manager@carsharing.com" }
              - column: { name: first_name, value: "Anna" }
              - column: { name: last_name, value: "Manager" }
              - column: { name: password, value: "$2a$10$0xQlqXuv/gTh278KTJvZneXSRy7GEb0qLRi1.yb4g/5nMXvf/ySIW" }

  - changeSet:
      id: assign-initial-roles
      author: senjars
      context: "!test"
      changes:
        - insert:
            tableName: users_roles
            columns:
              - column: { name: user_id, valueNumeric: 1 }
              - column: { name: role_id, valueNumeric: 1 }
        - insert:
            tableName: users_roles
            columns:
              - column: { name: user_id, valueNumeric: 2 }
              - column: { name: role_id, valueNumeric: 2 }

  - changeSet:
      id: insert-default-car-types
      author: senjars
      context: "!test"
      changes:
        - insert:
            tableName: car_types
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: type_name, value: "SEDAN" }
        - insert:
            tableName: car_types
            columns:
              - column: { name: id, valueNumeric: 2 }
              - column: { name: type_name, value: "SUV" }
        - insert:
            tableName: car_types
            columns:
              - column: { name: id, valueNumeric: 3 }
              - column: { name: type_name, value: "HATCHBACK" }
        - insert:
            tableName: car_types
            columns:
              - column: { name: id, valueNumeric: 4 }
              - column: { name: type_name, value: "UNIVERSAL" }