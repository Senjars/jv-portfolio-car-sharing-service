databaseChangeLog:
  - changeSet:
      id: 7
      author: senjars
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: rental_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: session_url
                  type: text
              - column:
                  name: session_id
                  type: varchar(255)
              - column:
                  name: amount
                  type: decimal
              - column:
                  name: status
                  type: varchar(50)
              - column:
                  name: payment_type
                  type: varchar(50)
                  constraints:
                    nullable: false

  - changeSet:
        id: add-created-at-to-payments
        author: senjars
        changes:
          - addColumn:
              tableName: payments
              columns:
                - column:
                    name: created_at
                    type: timestamp
                    defaultValueComputed: CURRENT_TIMESTAMP
                    constraints:
                      nullable: false

  - changeSet:
      id: add-fk-payments-rental-id
      author: senjars
      changes:
        - addForeignKeyConstraint:
            baseTableName: payments
            baseColumnNames: rental_id
            constraintName: fk_payments_rental_id
            referencedTableName: rentals
            referencedColumnNames: id
            onDelete: RESTRICT

  - changeSet:
      id: add-unique-rental-payment-type
      author: senjars
      changes:
        - addUniqueConstraint:
            tableName: payments
            columnNames: rental_id, payment_type
            constraintName: uq_payments_rental_id_payment_type