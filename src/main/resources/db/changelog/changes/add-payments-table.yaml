databaseChangeLog:
  - changeSet:
      id: 7
      author: senjars
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: rental_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: session_url
                  type: text
              - column:
                  name: session_id
                  type: varchar(255)
              - column:
                  name: amount
                  type: decimal
              - column:
                  name: status
                  type: varchar(50)