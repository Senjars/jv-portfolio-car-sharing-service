databaseChangeLog:
  - changeSet:
      id: 2
      author: senjars
      changes:
        - createTable:
            tableName: cars
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_cars
              - column:
                  name: model
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: brand
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: type_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name : inventory
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name : daily_fee
                  type: decimal(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name : is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

