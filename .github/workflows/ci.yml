name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: car_sharing_db
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Code Style (Checkstyle)
        run: mvn checkstyle:check -DskipTests

      - name: Build and Run Tests
        run: mvn clean verify
        env:
          DB_URL: jdbc:mysql://localhost:3306/car_sharing_db
          DB_USERNAME: user
          DB_PASSWORD: password

          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret-key-for-ci-pipeline-minimum-32-chars' }}
          JWT_EXPIRATION: 86400000
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_dummy' }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_dummy' }}
          APP_URL: http://localhost:8080